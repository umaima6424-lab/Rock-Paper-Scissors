<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play the classic Rock Paper Scissors game online for free!
     Test your luck and strategy against the computer with real-time score tracking.">
    <title>Rock Paper Scissors Game - Play Online Free</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="h">
    <h1>ROCK PAPER SCISSOR</h1>
    <br>
    <div class="pos">
    <button data-choice="rock"><i class="fa-solid fa-hand-back-fist">
    </i></button><br>
    <button data-choice="scissors"><i class='fa-solid fa-hand-scissors'></i></button><br>
    <button data-choice="paper"><i class="fa-solid fa-hand"></i></button><br>
    </div>
    <div class="game-area">
        <div class="player">
            <h2>You</h2>
            <div class="choice" id="player-choice">?</div>
        </div>
            <div class="vs"><h2>VS</h2>
            </div>
            <div class="computer">
                <h2>Computer</h2>
                <div class="choice" id="computer-choice">
                    ?
                </div>
            </div>
    </div>
    <div id="result">Choose Your Move!</div>
    <div class="score"><p>You&nbsp;:&nbsp;<span id="player-score">0</span></p>
    <p>Computer&nbsp;:&nbsp;<span id="computer-score">0</span></p></div>
    <script src="script.js"></script>
    </div>
</body>
</html>
